name: Build Flatpak package

on:
  workflow_call:
  workflow_dispatch:
  
jobs:
  flatpak:
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0
          lfs: false

      - name: Extract version
        id: qet_version
        run: |
          set -euo pipefail
          # This job runs in a container as root, but the checkout belongs to
          # the runner user: git then refuses to read the repository ("dubious
          # ownership"), and the version fell back to r0-0000000.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          eval "$(bash build-aux/qet-version.sh --format env)"
          echo "version=${DISPLAY_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: qelectrotech-${{ steps.qet_version.outputs.version }}-${{ matrix.variant.arch }}.flatpak
          artifact-name: qelectrotech-flatpak-${{ matrix.variant.arch }}
          manifest-path: build-aux/flatpak/org.qelectrotech.QElectroTech.json
          cache-key: flatpak-builder-${{ matrix.variant.arch }}-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}
          verbose: true
