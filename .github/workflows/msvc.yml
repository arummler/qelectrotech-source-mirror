name: MSVC
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-qt6:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/with-checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 1. Set up MSVC Developer Command Prompt
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # 1.5 Explicitly setup Ninja so vcpkg and CMake can see it in PATH
      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      # 2. Install Qt6
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          
      # 2.5 SQLite3         
      - name: Install SQLite3 via vcpkg
        run: vcpkg install sqlite3:x64-windows
        
      # 3. Configure and Build using Modern CMake Flags (No folder jumping required)
      - name: Build with CMake
        shell: pwsh
        run: |
          # Use modern CMake -S (source) and -B (build) flags instead of manually making directories
          cmake -G "Ninja" `
            -S . `
            -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DQT_VERSION_MAJOR=6 `
            -DBUILD_WITH_KF=OFF `
            -DPACKAGE_TESTS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
            
          # Build using the generated build folder. CMake handles parallel jobs automatically.
          cmake --build build --parallel
