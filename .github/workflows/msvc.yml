name: MSVC
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-qt6:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Locate or install Ninja
        shell: pwsh
        run: |
          $ninja = Get-Command ninja.exe -ErrorAction SilentlyContinue

          if ($ninja) {
            $ninjaPath = $ninja.Source
          }
          else {
            choco install ninja --yes --no-progress
            $ninjaPath = Join-Path $env:ChocolateyInstall "bin\ninja.exe"
          }

          if (-not (Test-Path $ninjaPath)) {
            throw "Ninja could not be located or installed."
          }

          & $ninjaPath --version
          "NINJA_EXE=$ninjaPath" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          Write-Host "MSVC:"
          where.exe cl
          cl 2>&1 | Select-Object -First 3

          Write-Host "Ninja: $env:NINJA_EXE"
          & $env:NINJA_EXE --version

          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_MAKE_PROGRAM="$env:NINJA_EXE" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DQT_VERSION_MAJOR=6 `
            -DBUILD_WITH_KF=OFF `
            -DPACKAGE_TESTS=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel
