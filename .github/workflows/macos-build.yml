name: macOS Build Check

# Runs on its own for every pull request and every push to master, and is
# also called from package.yml, which makes it a mandatory gate before any
# packaging (nightly, tag, manual run).
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

# On their own (pull request / push) a newer run replaces an older one. When
# called from package.yml (nightly, tag, manual) every run gets a group of its
# own, so nothing is cancelled and nothing collides with the caller's group.
concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && format('macos-build-{0}', github.ref) || format('macos-build-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build-macos:
    name: Clang ${{ matrix.deps }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
        deps: [default]
        include:
          # KDE Frameworks are deliberately not tested here: there is no
          # reliable Homebrew tap for KF6, and BUILD_KF=ON (build them from
          # source) is disabled in cmake/fetch_kdeaddons.cmake for now.
          - os: macos-latest
            deps: pugixml-system
            build_pugixml: "OFF"
            extra_pkgs: "pugixml"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          path: source

      - name: Install Qt6 dependencies
        run: |
          brew install qt cmake ninja ccache pkg-config sqlite ${{ matrix.extra_pkgs }}

      - name: Configure, build, install
        run: |
          set -euo pipefail
          SOURCE_DIR="${{ github.workspace }}/source"
          BUILD_DIR="${{ github.workspace }}/build"
          INSTALL_DIR="${{ github.workspace }}/install"
          QT_PREFIX="$(brew --prefix qt@6)"

          cmake -S "$SOURCE_DIR" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DBUILD_WITH_KF=OFF \
            -DBUILD_PUGIXML=${{ matrix.build_pugixml || 'ON' }} \
            -DPACKAGE_TESTS=ON \
            -DCMAKE_POLICY_DEFAULT_CMP0077=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

          cmake --build "$BUILD_DIR"
          cmake --install "$BUILD_DIR" --prefix "$INSTALL_DIR"

      # ipc-regression is X11-only (Xvfb/openbox/xdotool) and modal-quit-regression
      # skips itself on Apple, so only catch + qttest run here. offscreen: no
      # display server is needed for them.
      - name: Unit tests
        run: |
          QT_QPA_PLATFORM=offscreen ctest --test-dir "${{ github.workspace }}/build" --output-on-failure --no-tests=error
